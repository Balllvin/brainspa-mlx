[project]
name = "brainspa-mlx"
version = "0.1.0"
description = "Run Balllvin's MLX models (Dory 1.0 4B abliterated NVFP4 builds) on an Apple Silicon Mac"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "mlx==0.32.4",
    "mlx-lm @ git+https://github.com/pmichalas/mlx-lm@208065f3354e8c2645b658493b6aeb94eb0aaa77",
    "transformers==5.20.2",
    "tokenizers==0.23.3",
    "huggingface-hub==2.2.0",
    "numpy==2.5.4",
    "sentencepiece==0.2.2",
    "protobuf==7.36.2",
    "jinja2==3.1.6",
]

[project.scripts]
brainspa-mlx = "brainspa_mlx.cli:main"

[dependency-groups]
dev = ["pytest==9.0.3"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs a downloaded model (set BRAINSPA_MLX_MODEL to a repo id or folder)"]
